            $ref: "#/components/schemas/ChatVisto"
    SolicitudAdminResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreContacto:
          type: string
        emailContacto:
          type: string
        telefono:
          type: string
        municipio:
          type: string
        descripcion:
          type: string
        estado:
          type: string
        gremios:
          type: array
          items:
            type: string
        creadoEn:
          type: string
          format: date-time
    ProfesionalAdminResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        email:
          type: string
        telefono:
          type: string
        municipio:
          type: string
        estado:
          type: string
        gremios:
          type: array
          items:
            type: string
        creadoEn:
          type: string
          format: date-time
    MercadoImportacionResponse:
      type: object
      description: Resultado de la reimportación de los CSV del MIVAU
      properties:
        filasAlquiler:
          type: integer
          format: int32
          description: Filas de alquiler municipal escritas (nuevas + actualizadas)
          example: 7665
        filasVenta:
          type: integer
          format: int32
          description: Filas de valor tasado provincial escritas (nuevas + actualizadas)
          example: 8412
        fechaDescarga:
          type: string
          format: date-time
          description: Instante de descarga de los dos ficheros (ISO-8601)
          example: "2026-10-11T15:20:07Z"
    AlquilerMercadoResponse:
      type: object
      description: Alquiler municipal de referencia (SERPAVI), tipología colectiva
      properties:
        rentaMedianaEurM2Mes:
          type: number
          description: "Renta mediana en € por m² y mes (cuantía mediana dividida\
            \ entre la superficie mediana, según la metodología SERPAVI)"
          example: 13.16
        cuantiaMedianaEurMes:
          type: number
          description: Cuantía mediana del contrato en € al mes
          example: 868.8
    MercadoResponse:
      type: object
      description: Precios oficiales del mercado de la zona de un municipio
      properties:
        codigoINE:
          type: string
          description: Código INE de 5 dígitos consultado
          example: "28079"
        anio:
          type: integer
          format: int32
          description: "Año del dato de alquiler municipal; si no hay alquiler, el\
            \ año del dato de venta"
          example: 2024
        alquiler:
          $ref: "#/components/schemas/AlquilerMercadoResponse"
          description: "Alquiler municipal; null si el municipio no tiene dato publicado"
        venta:
          $ref: "#/components/schemas/VentaMercadoResponse"
          description: "Valor tasado provincial; null si la fuente no publica esa\
            \ provincia"
        fuente:
          type: string
          description: Fuente obligatoria (aviso legal MIVAU)
          example: Ministerio de Vivienda y Agenda Urbana
    VentaMercadoResponse:
      type: object
      description: Valor tasado de venta de la provincia
      properties:
        valorEurM2:
          type: number
          description: Valor tasado en € por m²
          example: 1588.7
        ambito:
          type: string
          description: Ámbito del dato
          example: PROVINCIA
        provincia:
          type: string
          description: Nombre de la provincia
          example: Zaragoza
        anio:
          type: integer
          format: int32
          description: Año del dato
          example: 2026
        trimestre:
          type: integer
          format: int32
          description: Trimestre del dato (1..4)
          example: 3
