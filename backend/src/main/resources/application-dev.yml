# Perfil DEV: sólo datos de ejemplo (skill config-secrets + base-de-datos).
# Los seeds viven en db/dev y NUNCA en db/migration: en prod no se aplican.
# Activación: ./mvnw spring-boot:run "-Dspring-boot.run.profiles=dev"
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    # Los seeds de desarrollo van en V900/V901, muy por encima de cualquier
    # migración real que llegue después (V3, V4...). Sin esta bandera, si el
    # esquema local ya está en 901 y aparece una V3, Flyway la marcaría como
    # "ignorada" (versión anterior a la actual) y el esquema real NO avanzaría.
    # Con out-of-order se aplican las migraciones reales en su orden aunque el
    # historial contenga los seeds. Sólo aquí: application-prod.yml fija
    # locations a classpath:db/migration, de modo que en prod no hay seeds
    # tampoco aunque esta bandera no esté activa.
    out-of-order: true
  jpa:
    properties:
      # FASE P2 (issue #32) — SÓLO DEV: dos interruptores de diagnóstico para
      # cazar N+1 y queries lentas sin tocar prod (application-prod.yml no
      # declara ninguno de los dos):
      #   * generate_statistics: al cierre de cada sesión Hibernate imprime
      #     queries, tiempo de carga/flush y statements (INFO);
      #   * org.hibernate.SQL=DEBUG: el SELECT COMPLETO de cada query. Se pide
      #     explícitamente en el issue #32 (antes se había decidido no
      #     activarlo por ruido); con él se puede pegar la query tal cual en
      #     EXPLAIN (ANALYZE, BUFFERS) de PostgreSQL.
      hibernate:
        generate_statistics: true
logging:
  level:
    org.hibernate.SQL: DEBUG

manti:
  scheduling:
    # En dev el planificador SÍ corre (despachador de notificaciones cada 15 s
    # y purga de refresh_tokens a las 04:17 Europe/Madrid). Es el default de
    # application.yml, escrito aquí explícito: es el único perfil donde las
    # tareas programadas se ejecutan de verdad (test lo apaga; prod hereda el
    # true de la base).
    enabled: true
