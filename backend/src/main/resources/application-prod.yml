# Perfil PROD (skill config-secrets).
# Activación: --spring.profiles.active=prod (o SPRING_PROFILES_ACTIVE=prod).
#
# Reglas duras de este perfil:
#   1. Flyway sólo mira db/migration. Los seeds de desarrollo (db/dev/V900,
#      V901 — inmuebles de ejemplo y el admin local) quedan FUERA del jar lógico
#      de producción: aunque el fichero viaje en el classpath, Flyway no lo ve y
#      jamás se ejecuta. Es la garantía de que las credenciales/datos de ejemplo
#      no pueden colarse en prod (además, el usuario admin sólo se crea con el
#      perfil dev).
#   2. springdoc apagado por defecto: la especificación y el Swagger UI no se
#      publican en producción. Se puede reabrir puntualmente con
#      SPRINGDOC_ENABLED=true sin tocar este fichero (nunca con secretos).
spring:
  flyway:
    locations: classpath:db/migration
    # En prod NO out-of-order: si alguien intenta meter una migración antigua
    # sobre un esquema más avanzado, debe fallar en vez de aplicarse a ciegas.
    out-of-order: false
  jpa:
    # Nunca update/create en prod: el esquema sólo cambia por Flyway.
    hibernate:
      ddl-auto: validate

server:
  # Revisión del PR #64 (MEDIO 3) — el backend va DETRÁS de un proxy (Vercel):
  # sin esto, todo el tráfico llega con la IP del proxy y el rate limit por IP
  # de AuthRateLimitFilter (login, forgot/reset, solicitudes) se vuelve inútil
  # —una sola ventana compartida para todos los usuarios— y la auditoría de
  # intentos de login no ve la IP real. Con 'framework' Spring instala
  # ForwardedHeaderFilter y confía en X-Forwarded-For/-Proto/-Host.
  #
  # La variable FORWARD_HEADERS_STRATEGY ya está en Vercel (la reescribe el
  # edge); se expone por si hay que apagarla con 'none' sin redeploy de código.
  # El perfil base (dev/local) NO se toca: ahí no hay proxy y confiar en esas
  # cabeceras permitiría spoofing de IP.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

# FASE 7 — recorte duro del actuator en producción (issue #25, revisión del PR).
#   1. Exposición por defecto SÓLO health,info: metrics y prometheus quedan
#      fuera y hay que abrirlos a mano con
#      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE si se scrapea Prometheus (el
#      endpoint sigue exigiendo rol ADMIN aunque se exponga).
#   2. El export a Prometheus apagado por defecto: sin scraper no se gasta CPU
#      ni memoria en series que nadie lee; PROMETHEUS_EXPORT_ENABLED=true lo
#      reabre junto a la exposure anterior.
#   3. health sin detalle: fuera de componentes/indicators (ni versions de
#      Hibernate/JDBC ni estado de discos) para el healthcheck anónimo.
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_EXPORT_ENABLED:false}
  endpoint:
    health:
      show-details: never
