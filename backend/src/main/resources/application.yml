spring:
  application:
    name: manti-backend
  # Carga de secretos locales desde la raíz del monorepo (gitignored). En prod
  # las mismas variables vienen del entorno del hosting (mayor precedencia).
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/manti}
    username: ${DB_USER:manti}
    password: ${DB_PASSWORD:manti_dev}
    # FASE 7 (issue #31) — Hikari explícito. 10 conexiones es el default y NO
    # se sube sin métrica que lo justifique: mirar hikaricp_connections_active
    # y hikaricp_connections_pending en /actuator/metrics (issue #25) antes de
    # tocarlo; más conexiones no arreglan queries lentas y saturan PostgreSQL.
    # connection-timeout fija el default (30 s): nadie espera eternamente a una
    # conexión libre del pool.
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # FASE 7 (issue #31) — timeouts por defecto del cliente HTTP saliente de
  # Spring (RestClient/RestTemplate auto-configurados): 3 s de conexión y 5 s
  # de lectura para que una llamada externa caída no colgue un hilo. Ojo:
  # Brevo/Telegram NO pasan por aquí — usan su propio cliente con los MISMOS
  # 3 s/5 s (NotificacionesHttpConfig) — y el OAuth2 de Google usa la pila de
  # Spring Security. La clave correcta en Boot 4.1 es spring.http.clients.*
  # (spring.http.client.* se deprecó en 4.0); exige spring-boot-restclient en
  # el classpath (pom.xml).
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  # FASE 7 (issue #26) — virtual threads en el servidor (Tomcat) y en las tareas
  # @Scheduled: los hilos HTTP sólo esperan I/O (JDBC, llamadas a Brevo/Telegram,
  # Google), así que el pool de platform threads deja de ser el cuello de
  # botella. NO es default en Boot 4.1. Para vigilar hilos pinned en producción:
  # jcmd <pid> Thread.print y las métricas de threads del actuator.
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: 8080

springdoc:
  # Se pueden apagar en prod con SPRINGDOC_ENABLED=false (recomendado junto al
  # perfil prod que se creará en una fase posterior).
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        # health e info quedan ANÓNIMOS (SecurityConfig); metrics y prometheus
        # sólo con rol ADMIN (issue #25). En prod se puede recortar la lista con
        # MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE si no se scrapea Prometheus.
        include: health,info,metrics,prometheus
  # Export de métricas a Prometheus (issue #25). En Boot 4 la condición
  # @ConditionalOnEnabledMetricsExport es opt-in: sin esto el registry ni se
  # crea y /actuator/prometheus sale 404 (la clave antigua
  # management.metrics.export.prometheus.* está deprecada desde 3.0).
  prometheus:
    metrics:
      export:
        enabled: true
  defaults:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      # Percentiles de http.server.requests, hikaricp_* y JVM: mirar p95/p99,
      # no la media (skill rendimiento). Se calculan en memoria por timer.
      percentiles:
        - 0.5
        - 0.95
        - 0.99

# ---------------------------------------------------------------------------
# Autenticación (FASE 1). Los secretos sólo existen como variables de entorno
# (ver .env.example); nunca se escriben literales aquí.
# ---------------------------------------------------------------------------
auth:
  jwt:
    secret: ${JWT_SECRET}                    # HS256, mínimo 32 caracteres
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cookie:
    name: refresh_token
    path: /api/v1/auth
    # Local: Lax. Producción cross-site (front y API en dominios distintos):
    # COOKIE_SAMESITE=None + COOKIE_SECURE=true (obligatorio None con Secure).
    same-site: ${COOKIE_SAMESITE:Lax}
    secure: ${COOKIE_SECURE:false}
  oauth2:
    google:
      frontend-url: ${FRONTEND_URL:http://localhost:3000}
      code-ttl: 2m
  rate-limit:
    login-per-minute: ${AUTH_RATE_LOGIN_PER_MINUTE:10}
    register-per-minute: ${AUTH_RATE_REGISTER_PER_MINUTE:5}
    # FASE 5 — ventanas de 1 HORA (AuthRateLimitFilter) sobre rutas públicas.
    solicitudes-per-hour: ${AUTH_RATE_SOLICITUDES_PER_HOUR:10}
    registro-profesional-per-hour: ${AUTH_RATE_REGISTRO_PROFESIONAL_PER_HOUR:5}

manti:
  cors:
    # Allowlist explícita (nunca '*'): separada por comas.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  # ---------------------------------------------------------------------------
  # FASE 7 — purga diaria de refresh_tokens caducados (issue #8).
  # true salvo en el perfil de test (application-test.yml), donde el job ni se
  # crea. Apagar desde el entorno con PURGAS_ENABLED=false.
  # ---------------------------------------------------------------------------
  purgas:
    enabled: ${PURGAS_ENABLED:true}
  # ---------------------------------------------------------------------------
  # FASE 5 — notificaciones (outbox transaccional + despachador @Scheduled).
  # Los secretos llegan SOLO por variables de entorno (.env en local, hosting
  # en prod): nunca se escriben literales aquí.
  # ---------------------------------------------------------------------------
  notificaciones:
    # Interruptor global del ENVÍO. Apagado (local y CI) el despachador no
    # llama a ningún proveedor: las filas siguen en PENDIENTE y se envían al
    # activarlo con NOTIFICACIONES_ENABLED=true.
    enabled: ${NOTIFICACIONES_ENABLED:false}
    # false SÓLO en el perfil test (application-test.yml): sin planificador,
    # los tests invocan el despachador a mano sin que una tarea programada
    # los ensucie. En cualquier otro entorno, el despachador corre solo.
    programado: true
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
    brevo:
      api-key: ${BREVO_API_KEY:}
      from-email: ${NOTIF_EMAIL_FROM:no-reply@manti.dev}
      from-name: MantiInmobiliaria
