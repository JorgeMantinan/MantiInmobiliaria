spring:
  application:
    name: manti-backend
  # Carga de secretos locales desde la raíz del monorepo (gitignored). En prod
  # las mismas variables vienen del entorno del hosting (mayor precedencia).
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/manti}
    username: ${DB_USER:manti}
    password: ${DB_PASSWORD:manti_dev}
    # FASE 7 (issue #31) — Hikari explícito. NO se sube sin mirar antes
    # hikaricp.connections.pending en /actuator/metrics (issue #25): subir el
    # pool no arregla queries lentas y satura PostgreSQL (18 admite 100
    # clientes). El tamaño queda tunneable por variable de entorno para poder
    # subirlo con una métrica que lo justifique, sin redeplegar. El resto de
    # timeouts dejan los defaults de Hikari (connection-timeout 30 s).
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
      # FASE 7 (issue #29) — fuerza plan PERSONALIZADO en cada sentencia de
      # PostgreSQL 18. Las queries del listado de inmuebles usan guardas
      # (:param IS NULL OR col = :param); con un plan GENÉRICO cacheado
      # (plan_cache_mode=auto puede fijarlo tras 5 ejecuciones y queda así de
      # por vida en la conexión del pool) PG no convierte las guardas en
      # Index Cond y cae en un Filter con Seq Scan. Medido con EXPLAIN
      # (ANALYZE, BUFFERS) sobre 200k filas: 3882 buffers / 13.3 ms (genérico)
      # vs 1194 buffers / 3.8 ms (personalizado, Index Cond en
      # idx_inmuebles_estado_tipo_precio). Coste: ~0.2 ms extra de planning.
      # Se ejecuta al abrir cada conexión física del pool.
      connection-init-sql: SET plan_cache_mode=force_custom_plan
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # FASE 7 (issue #31) — timeouts PREVENTIVOS del cliente HTTP que Spring Boot
  # auto-configura (RestClient.Builder/RestTemplateBuilder): 3 s de conexión y
  # 5 s de lectura para que una llamada externa caída no colgue un hilo.
  # Sólo afecta a esos clientes auto-configurados: Brevo y Telegram ya llevan
  # sus propios timeouts de 3 s/5 s (NotificacionesHttpConfig) y el OAuth2 de
  # Google usa la pila de Spring Security. Clave vigente en Boot 4.1
  # (spring.http.client.* se deprecó en 4.0); exige spring-boot-restclient en
  # el classpath (pom.xml).
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s
  # FASE 7 (issue #26) — virtual threads en el servidor (Tomcat) y en las tareas
  # @Scheduled: los hilos HTTP sólo esperan I/O (JDBC, llamadas a Brevo/Telegram,
  # Google), así que el pool de platform threads deja de ser el cuello de
  # botella. NO es default en Boot 4.1. Para vigilar hilos pinned en producción:
  # jcmd <pid> Thread.print y las métricas de threads del actuator.
  threads:
    virtual:
      enabled: true
  # Pool del planificador @Scheduled: con 1 (default) la evaluación de
  # alertas (#96) serializa el despachador de notificaciones y la purga de
  # refresh tokens. Con 2, el job de alertas nunca retarda los envíos.
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:2}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: 8080
  tomcat:
    # Límite de tamaño de cuerpo (A04): BodySizeLimitFilter devuelve 413 con
    # Content-Length > 256 KiB; aquí se acota además lo que Tomcat "se traga"
    # al desconectar una petición rechazada (es el respaldo para cuerpos
    # chunked, sin Content-Length declarada). NOTA: max-http-post-size /
    # max-http-form-post-size NO aplican a JSON: sólo miden cuerpos de
    # formularios (application/x-www-form-urlencoded).
    max-swallow-size: 256KB

springdoc:
  # Se pueden apagar en prod con SPRINGDOC_ENABLED=false (recomendado junto al
  # perfil prod que se creará en una fase posterior).
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        # Sólo /actuator/health es anónimo; info, metrics y prometheus exigen
        # rol ADMIN (SecurityConfig, issue #25). En prod la lista se recorta a
        # SOLO health (application-prod.yml, issue #6) y se reabre con
        # MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE si hace falta scrapear.
        include: health,info,metrics,prometheus
  # Export a Prometheus (issue #25): la clave POR REGISTRY es la que decide.
  # Si no está a true, la condición @ConditionalOnEnabledMetricsExport no crea
  # el registry (aunque los defaults del resto de registries estén a true) y
  # /actuator/prometheus responde 404 — lo cubre ActuatorSeguridadTest.
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      # Percentiles de http.server.requests, hikaricp_* y JVM: mirar p95/p99,
      # no la media (skill rendimiento). Se calculan en memoria por timer.
      percentiles:
        - 0.5
        - 0.95
        - 0.99

# ---------------------------------------------------------------------------
# Autenticación (FASE 1). Los secretos sólo existen como variables de entorno
# (ver .env.example); nunca se escriben literales aquí.
# ---------------------------------------------------------------------------
auth:
  jwt:
    secret: ${JWT_SECRET}                    # HS256, mínimo 32 caracteres
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cookie:
    name: refresh_token
    path: /api/v1/auth
    # Local: Lax. Producción cross-site (front y API en dominios distintos):
    # COOKIE_SAMESITE=None + COOKIE_SECURE=true (obligatorio None con Secure).
    same-site: ${COOKIE_SAMESITE:Lax}
    secure: ${COOKIE_SECURE:false}
  oauth2:
    google:
      frontend-url: ${FRONTEND_URL:http://localhost:3000}
      code-ttl: 2m
  # issue #57 — restablecimiento de contraseña: el enlace que viaja por email
  # es ${frontend-url}/restablecer?token=<opaco> y caduca en ttl.
  password-reset:
    ttl: ${AUTH_PASSWORD_RESET_TTL:15m}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    # false (prod) = el email se envía tras el commit en un executor acotado
    # (el 202 no espera a Brevo); true = envío en línea, sólo para tests
    # (application-test.yml) que verifican el puerto con un mock.
    sync: ${AUTH_PASSWORD_RESET_SYNC:false}
  # ---------------------------------------------------------------------------
  # issue #10 — Have I Been Pwned (pwned passwords). En registro y
  # restablecimiento de contraseña se comprueba si el password aparece en
  # filtraciones públicas, vía protocolo de k-anonymity (SÓLO sale el prefijo
  # de 5 caracteres del SHA-1; sin API key). Si HIBP no responde en 3 s se
  # deja pasar el password (fail open + log.warn): la disponibilidad del
  # registro no depende de un tercero. El perfil de test lo apaga para que la
  # suite nunca salga a la red (application-test.yml). Desactivable con
  # AUTH_HIBP_ENABLED=false.
  # ---------------------------------------------------------------------------
  hibp:
    enabled: ${AUTH_HIBP_ENABLED:true}
  # ---------------------------------------------------------------------------
  # Issues #10 y #5 — protección del login en DOS dimensiones, además del rate
  # limit por IP (AuthRateLimitFilter, que se mantiene: son capas):
  #   * backoff por CUENTA (#10): tras N fallos consecutivos (da igual la IP),
  #     cada fallo adicional bloquea esa cuenta 1, 2, 4, 8... minutos (tope
  #     configurable); un acierto resetea el contador. La 429 lleva
  #     Retry-After.
  #   * ventana por par sha256(IP+email) (#5): P intentos/minuto por
  #     combinación; un atacante con muchas IPs no concentra la fuerza bruta
  #     en UNA cuenta y una IP de NAT no castiga a las otras cuentas.
  # En memoria (Caffeine), best-effort para una instancia. Apagable con
  # AUTH_LOGIN_PROTECTION_ENABLED=false; el perfil de test lo apaga y las
  # clases dedicadas lo reactivan con límites bajos.
  # ---------------------------------------------------------------------------
  login:
    enabled: ${AUTH_LOGIN_PROTECTION_ENABLED:true}
    fallos-antes-de-backoff: ${AUTH_LOGIN_FALLOS_BACKOFF:5}
    backoff-inicial: ${AUTH_LOGIN_BACKOFF_INICIAL:1m}
    factor-backoff: ${AUTH_LOGIN_BACKOFF_FACTOR:2}
    backoff-tope: ${AUTH_LOGIN_BACKOFF_TOPE:15m}
    # Vida del contador en caché; debe ser MAYOR que backoff-tope.
    ventana-fallos: ${AUTH_LOGIN_VENTANA_FALLOS:30m}
    pares-por-minuto: ${AUTH_LOGIN_PARES_POR_MINUTO:5}
  rate-limit:
    login-per-minute: ${AUTH_RATE_LOGIN_PER_MINUTE:10}
    register-per-minute: ${AUTH_RATE_REGISTER_PER_MINUTE:5}
    # FASE 5 — ventanas de 1 HORA (AuthRateLimitFilter) sobre rutas públicas.
    solicitudes-per-hour: ${AUTH_RATE_SOLICITUDES_PER_HOUR:10}
    registro-profesional-per-hour: ${AUTH_RATE_REGISTRO_PROFESIONAL_PER_HOUR:5}
    # issue #57 — olvido (5/hora) y canje (10/hora) de contraseña por IP.
    forgot-password-per-hour: ${AUTH_RATE_PASSWORD_FORGOT_PER_HOUR:5}
    reset-password-per-hour: ${AUTH_RATE_PASSWORD_RESET_PER_HOUR:10}
    # follow-up #98 — escrituras del CRUD de alertas por IP (30/min).
    alertas-per-minute: ${AUTH_RATE_ALERTAS_PER_MINUTE:30}
    # ---------------------------------------------------------------------------
    # FASE P2 (issues #17 y #22) — rutas nuevas del rate limit, todas con
    # ventana de 60 s por IP y tunneables por variable de entorno:
    #   * refresh: 60/min. El bootstrap multi-pestaña dispara varias rotaciones
    #     seguidas al abrir la app; 60/min no corta esa ráfaga pero acota el
    #     bombardeo de la cookie httpOnly (issue #17).
    #   * oauth2-token: 20/min. Cada login con Google canjea UN código; el
    #     límite frena el envío de códigos caducados, que obliga al backend a
    #     llamar a Google en cada intento.
    #   * inmuebles: 300/min. GET público anónimo del listado (issue #22): la
    #     caché de COUNT del PR #94 amortigua el coste; este límite acota las
    #     queries de página (ILIKE trgm + keyset). 300/min porque la IP puede
    #     ser compartida (NAT de oficina/CGNAT): un portal humano real no
    #     pasa de ~30 req/min, pero varias personas detrás de la misma IP sí.
    #   * swipes/deck/favoritos: escrituras y lecturas autenticadas baratas
    #     (comentario del issue #17); defaults holgados para uso real.
    # ---------------------------------------------------------------------------
    refresh-per-minute: ${AUTH_RATE_REFRESH_PER_MINUTE:60}
    oauth2-token-per-minute: ${AUTH_RATE_OAUTH2_TOKEN_PER_MINUTE:20}
    inmuebles-per-minute: ${AUTH_RATE_INMUEBLES_PER_MINUTE:300}
    swipes-per-minute: ${AUTH_RATE_SWIPES_PER_MINUTE:120}
    deck-per-minute: ${AUTH_RATE_DECK_PER_MINUTE:300}
    favoritos-per-minute: ${AUTH_RATE_FAVORITOS_PER_MINUTE:300}

manti:
  cors:
    # Allowlist explícita (nunca '*'): separada por comas.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  # ---------------------------------------------------------------------------
  # issue #9 — HSTS (Strict-Transport-Security). Apagado fuera de prod: en
  # local se sirve por http:// y la cabecera sería contraproducente. El perfil
  # prod la activa (application-prod.yml) con includeSubDomains y un año de
  # max-age tunneable por HSTS_MAX_AGE_SEGUNDOS. Spring Security sólo la
  # emite si la petición es segura (X-Forwarded-Proto https vía proxy).
  # ---------------------------------------------------------------------------
  seguridad:
    hsts:
      enabled: ${HSTS_ENABLED:false}
      max-age-segundos: ${HSTS_MAX_AGE_SEGUNDOS:31536000}
  # ---------------------------------------------------------------------------
  # FASE 7 (issue #27) — caché Caffeine del COUNT totalElements del listado
  # público de inmuebles (ConteoInmueblesCache). TTL corto como red de
  # seguridad (la invalidación real es explícita tras el commit de cada
  # escritura backoffice) y tamaño acotado: la clave es la combinación de
  # filtros normalizada, no el usuario. El contrato de GET /api/v1/inmuebles
  # no cambia. Desactivable con MANTI_INMUEBLES_CONTEO_CACHE_TTL=0s.
  # ---------------------------------------------------------------------------
  inmuebles:
    conteo-cache:
      ttl: ${MANTI_INMUEBLES_CONTEO_CACHE_TTL:2m}
      max-entradas: ${MANTI_INMUEBLES_CONTEO_CACHE_MAX_ENTRADAS:2000}
  # ---------------------------------------------------------------------------
  # FASE 7 — planificador global de Spring (@Scheduled): despachador de
  # notificaciones y purga de refresh_tokens. Guard PROPIO e independiente del
  # envío (manti.notificaciones.enabled) y de la purga (manti.purgas.enabled):
  # apagar uno ya no apaga los demás (issue #8, revisión del PR). Sólo el
  # perfil de test lo apaga (application-test.yml); se puede desactivar con
  # MANTI_SCHEDULING_ENABLED=false.
  # ---------------------------------------------------------------------------
  scheduling:
    enabled: true
  # ---------------------------------------------------------------------------
  # FASE 7 — purga diaria de refresh_tokens caducados (issue #8).
  # true salvo en el perfil de test (application-test.yml), donde el job ni se
  # crea. Apagar desde el entorno con PURGAS_ENABLED=false.
  # ---------------------------------------------------------------------------
  purgas:
    enabled: ${PURGAS_ENABLED:true}
  # ---------------------------------------------------------------------------
  # issue #96 — ALERTAS DE BÚSQUEDA: evaluación programada de las alertas
  # activas (AlertaEvaluacionJob) y enlace del aviso al listado del frontend.
  # Tres interruptores INDEPENDIENTES, como el resto de tareas:
  #   * enabled: crea o no el job (true salvo en el perfil de test);
  #   * cadencia-ms: fixedDelay entre pasadas (15 min por defecto);
  #   * frontend-url: base del enlace "Ver la búsqueda" del email — misma
  #     variable FRONTEND_URL que usan Google OAuth2 y el reset de contraseña.
  # El ENVÍO sigue siendo de manti.notificaciones.enabled (outbox compartido).
  # El follow-up #98 añade lote: tamaño del barrido por transacción (500).
  # ---------------------------------------------------------------------------
  alertas:
    enabled: ${ALERTAS_ENABLED:true}
    cadencia-ms: ${ALERTAS_CADENCIA_MS:900000}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    lote: ${ALERTAS_LOTE:500}
  # ---------------------------------------------------------------------------
  # FASE 5 — notificaciones (outbox transaccional + despachador @Scheduled).
  # Los secretos llegan SOLO por variables de entorno (.env en local, hosting
  # en prod): nunca se escriben literales aquí.
  # ---------------------------------------------------------------------------
  notificaciones:
    # Interruptor global del ENVÍO. Apagado (local y CI) el despachador no
    # llama a ningún proveedor: las filas siguen en PENDIENTE y se envían al
    # activarlo con NOTIFICACIONES_ENABLED=true. Es independiente de si el
    # planificador está encendido (manti.scheduling.enabled).
    enabled: ${NOTIFICACIONES_ENABLED:false}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
    brevo:
      api-key: ${BREVO_API_KEY:}
      from-email: ${NOTIF_EMAIL_FROM:no-reply@manti.dev}
      from-name: MantiInmobiliaria
