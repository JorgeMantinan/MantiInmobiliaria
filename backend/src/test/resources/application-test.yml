# Perfil activo en los tests (@ActiveProfiles("test")).
# Proporciona valores de PRUEBA (no son secretos reales) para que el build
# funcione también en CI, donde no existe el .env de la raíz.

spring:
  # ---------------------------------------------------------------------------
  # Issue #28 — datasource DEDICADO de la suite: BD manti_test, NUNCA manti_dev.
  # Antes no había datasource en este perfil y la suite heredaba el de
  # application.yml (BD dev): churn de inserts/deletes sobre datos reales y
  # bloat de índices. La BD y su rol los asegura la propia suite al arrancar
  # (TestDatabaseBootstrap vía ContextCustomizerFactory, ver
  # src/test/resources/META-INF/spring.factories) y Flyway migra el esquema
  # desde cero. Overrides por entorno: TEST_DB_URL / TEST_DB_USER /
  # TEST_DB_PASSWORD y TEST_ADMIN_URL / TEST_ADMIN_USER / TEST_ADMIN_PASSWORD
  # (CI apunta a localhost:5432; los defaults son el docker-compose en 5433).
  # ---------------------------------------------------------------------------
  flyway:
    # La BD manti_test arranca SIEMPRE vacía y Flyway migra V1..Vn desde cero,
    # así que el historial es lineal. out-of-order se mantiene por simetría con
    # dev (application-dev.yml): es inocuo y evita que una migración nueva de
    # versión menor quede "ignorada" si la BD de test arrastra historial.
    out-of-order: true
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5433/manti_test}
    username: ${TEST_DB_USER:manti_test}
    password: ${TEST_DB_PASSWORD:manti_test}
    hikari:
      # Cada contexto de prueba (propias las clases con @SpringBootTest(properties=...))
      # mantiene SU pool abierto hasta que termina la JVM. Con 10+ contextos y el
      # mínimo de 10 conexiones por pool se superan los 100 clientes que admite
      # PostgreSQL por defecto: "FATAL: sorry, too many clients already".
      # Los tests son secuenciales y monohilo: 3 conexiones por contexto bastan.
      maximum-pool-size: 3
      minimum-idle: 3

JWT_SECRET: manti-test-only-secret-000000000000000000000000000000000000000000
GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
GOOGLE_CLIENT_SECRET: test-client-secret
FRONTEND_URL: http://localhost:3000
ALLOWED_ORIGINS: http://localhost:3000

# Los tests MockMvc comparten la misma IP de origen; se suben los límites para
# no interferir con el rate limiting (que se testea en una clase propia).
auth:
  rate-limit:
    login-per-minute: 100000
    register-per-minute: 100000
    solicitudes-per-hour: 100000
    registro-profesional-per-hour: 100000
    forgot-password-per-hour: 100000
    reset-password-per-hour: 100000
  password-reset:
    # Revisión del PR #64: en test el envío del enlace va EN LÍNEA para que
    # los tests puedan verificar el puerto con un mock sin carreras de hilos.
    # El camino asíncrono real se prueba en PasswordResetAsyncEnvioTest, que
    # sobreescribe esta propiedad a false.
    sync: true

manti:
  scheduling:
    # Sin planificador en test: NINGUNA tarea @Scheduled se dispara sola; los
    # tests invocan el despachador y la purga a mano y los resultados no
    # dependen de un cron corriendo en paralelo. Guard propio, independiente
    # de manti.notificaciones.enabled y manti.purgas.enabled.
    enabled: false
  purgas:
    # El job de purga de refresh_tokens (issue #8) NO existe en test: ninguna
    # tarea programada puede borrar filas mientras corren los tests. La acción
    # se prueba llamando a RefreshTokenPurgaService.purgar() a mano.
    enabled: false
  alertas:
    # El job de alertas (issue #96) TAMPOCO existe en test: ninguna tarea
    # programada encola avisos mientras corren los tests. La evaluación se
    # prueba llamando a AlertaEvaluacionService.evaluar() a mano.
    enabled: false
  notificaciones:
    # Guard del ENVÍO (no del planificador): con false el despachador no lee
    # ni envía nada aunque se le llame a mano. Si un test quiere probar el
    # envío, lo activa con @SpringBootTest(properties=...).
    enabled: false
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
    brevo:
      api-key: ${BREVO_API_KEY:}
      from-email: no-reply@manti.test
      from-name: MantiInmobiliaria
