services:
  postgres:
    image: postgres:18-alpine
    container_name: manti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: manti
      POSTGRES_USER: manti
      POSTGRES_PASSWORD: manti_dev
    ports:
      # Sólo localhost: el Postgres de desarrollo NO se expone en todas las
      # interfaces (5433 en local; el equipo tiene otro PG nativo en el 5432).
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manti -d manti"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
