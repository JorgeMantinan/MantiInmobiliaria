# Mantiene despierto el contenedor del backend en Vercel (Container Images
# hace scale-to-zero tras ~5 min sin peticiones; cada arranque en frío cuesta
# ~40 s de cold start que el usuario paga en la primera carga). Un healthcheck
# cada 5 min entra de lleno en la cuota Hobby (memory-time) y evita el
# "comprobando conexion" de más de un segundo.
name: keep-alive-api

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar API (health UP)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://mantiinmobiliaria-api.vercel.app/actuator/health || true)
            echo "intento $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "La API no respondio UP en 6 intentos (cold start largo o caida)"
          exit 1

# re-registro del schedule (GitHub a veces no registra el cron en repos nuevos hasta nuevo push)
