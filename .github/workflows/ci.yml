name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read
  # gitleaks-action necesita leer los commits del PR (pulls: read) en eventos pull_request
  pull-requests: read

jobs:
  # Escaneo de secretos en todo el historial del push/PR.
  # Nota: gitleaks/gitleaks-action@v2 es gratuito para usuarios individuales;
  # para organizaciones requiere licencia (GITLEAKS_LICENSE).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks necesita el historial completo
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    env:
      # En CI el Postgres del service container expone 5432; en local (Docker) usamos 5433
      DB_URL: jdbc:postgresql://localhost:5432/manti
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: manti
          POSTGRES_USER: manti
          POSTGRES_PASSWORD: manti_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Permisos mvnw
        working-directory: backend
        run: chmod +x mvnw

      - name: Build y tests backend
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

      - name: Subir informes Surefire
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests frontend
        run: npm test

      - name: Audit producción
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          # lib/auth.ts exige NEXT_PUBLIC_API_URL en producción y hace fallar el
          # build si falta; en CI sólo comprobamos que compila con un valor dummy.
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # Los dos Dockerfiles del backend deben mantener el mismo cuerpo de build
  # (cabeceras-comentario aparte). Ver .github/DEPLOY.md.
  docker-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Comparar cuerpos de build
        run: |
          strip() { grep -v '^[[:space:]]*#' "$1" | sed 's/\r$//'; }
          diff <(strip backend/Dockerfile) <(strip backend/Dockerfile.vercel) \
            || { echo "::error::backend/Dockerfile y Dockerfile.vercel divergen - sincronizar ambos (ver .github/DEPLOY.md)"; exit 1; }
