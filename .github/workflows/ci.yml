# Todas las acciones estan fijadas por SHA inmutable con la version en comentario
# (issue #58): los tags movibles (@v4, @v2) permiten que un tag hijackeado cambie
# el codigo ejecutado sin tocar el workflow. Dependabot (github-actions) se encarga
# de actualizar los SHAs cada semana.
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read
  # gitleaks-action necesita leer los commits del PR (pulls: read) en eventos pull_request
  pull-requests: read

jobs:
  # Escaneo de secretos en todo el historial del push/PR.
  # Nota: gitleaks/gitleaks-action@v2 es gratuito para usuarios individuales;
  # para organizaciones requiere licencia (GITLEAKS_LICENSE).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks necesita el historial completo
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    env:
      # En CI el Postgres del service container expone 5432; en local (Docker) usamos 5433
      DB_URL: jdbc:postgresql://localhost:5432/manti
      # Issue #28: la suite de tests usa la BD dedicada manti_test (nunca la dev
      # manti). El rol/BD lo crea el paso "Crear BD y rol de tests" de este job;
      # en local la crea la propia suite (TestDatabaseBootstrap).
      TEST_DB_URL: jdbc:postgresql://localhost:5432/manti_test
      TEST_ADMIN_URL: jdbc:postgresql://localhost:5432/postgres
    services:
      postgres:
        image: ghcr.io/jorgemantinan/postgres:18-alpine
        env:
          POSTGRES_DB: manti
          POSTGRES_USER: manti
          POSTGRES_PASSWORD: manti_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Permisos mvnw
        working-directory: backend
        run: chmod +x mvnw

      # Issue #28 - BD de tests dedicada (manti_test): se crea de forma
      # idempotente con el superusuario del service container. La propia suite
      # tambien la asegura (TestDatabaseBootstrap), pero el paso explicito
      # deja la intencion visible en el CI y falla temprano si el servicio
      # postgres no esta operativo. NO toca el job e2e (su propio servicio).
      - name: Crear BD y rol de tests (manti_test)
        run: |
          PG=$(docker ps -qf ancestor=ghcr.io/jorgemantinan/postgres:18-alpine | head -n1)
          test -n "$PG"
          docker exec "$PG" psql -U manti -d postgres -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'manti_test') THEN CREATE ROLE manti_test LOGIN PASSWORD 'manti_test'; END IF; END \$\$;"
          docker exec "$PG" psql -U manti -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'manti_test'" | grep -q 1 || \
            docker exec "$PG" psql -U manti -d postgres -c "CREATE DATABASE manti_test OWNER manti_test"

      - name: Build y tests backend
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

      - name: Subir informes Surefire
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # test:coverage ejecuta la misma suite que npm test y ademas publica el
      # informe v8 (sin thresholds: no puede romper el CI; issue #13).
      - name: Tests frontend (con coverage)
        run: npm run test:coverage

      - name: Audit producciÃ³n
        run: npm audit --omit=dev --audit-level=high

      # Gate de CRITICAL desde ya, sin --omit=dev: los 5 high de dev (cadena
      # eslint-config-next) van en el issue #11; NO subir este paso a
      # --audit-level=high sin --omit=dev porque romperÃ­a el CI hoy.
      - name: Audit crÃ­tica (incluye dev)
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build
        env:
          # lib/auth.ts exige NEXT_PUBLIC_API_URL en producciÃ³n y hace fallar el
          # build si falta; en CI sÃ³lo comprobamos que compila con un valor dummy.
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # ---------------------------------------------------------------------------
  # Smoke E2E del portal con navegador real (issue #74). Job INDEPENDIENTE
  # (sin `needs`): levanta backend+PostgreSQL reales y el frontend de
  # produccion, y corre Playwright (chromium) contra ellos. Su proposito es
  # cazar regresiones de contrato API que los tests unitarios no ven (el bug
  # #73 del prefijo /api/v1 llego a produccion porque todo mockeaba apiFetch).
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: []
    env:
      # En CI el Postgres del service container expone 5432 (como en backend).
      DB_URL: jdbc:postgresql://localhost:5432/manti
    services:
      postgres:
        image: ghcr.io/jorgemantinan/postgres:18-alpine
        env:
          POSTGRES_DB: manti
          POSTGRES_USER: manti
          POSTGRES_PASSWORD: manti_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Permisos mvnw
        working-directory: backend
        run: chmod +x mvnw

      # El job `backend` ya ejecuta la suite completa; aqui sólo se empaqueta.
      - name: Build backend (sin tests)
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - name: Arrancar backend (dev + seed) y esperar health
        env:
          SPRING_PROFILES_ACTIVE: dev
          # El frontend bajo prueba corre en :3010; el jar exige CORS explicito.
          ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3010
          FRONTEND_URL: http://localhost:3010
          # Valores dummy SOLO para el smoke: el jar exige JWT_SECRET (>= 32
          # caracteres) y el registration de Google no puede ser nulo para
          # construir el ClientRegistration. No son secretos reales.
          JWT_SECRET: e2e-smoke-secret-0123456789abcdefghijklmnop
          GOOGLE_CLIENT_ID: e2e-smoke-client-id
          GOOGLE_CLIENT_SECRET: e2e-smoke-client-secret
          # Sin credenciales: nada de email/Telegram en CI.
          NOTIFICACIONES_ENABLED: "false"
          # Rate limit fuera del camino del smoke (defaults reales: 300/min
          # listado; el smoke los cumple, pero un techo enorme elimina la
          # fragilidad si crecen las specs).
          AUTH_RATE_INMUEBLES_PER_MINUTE: "100000"
          AUTH_RATE_SWIPES_PER_MINUTE: "100000"
        run: |
          nohup java -jar backend/target/*.jar > backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8080/api/v1/inmuebles?limit=1" > /dev/null; then
              echo "Backend arriba tras ${i} intentos"
              exit 0
            fi
            sleep 2
          done
          echo "::error::El backend no respondio en 120s"
          tail -n 100 backend-e2e.log
          exit 1

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend (produccion)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

      - name: Arrancar frontend (next start :3010) y esperar
        working-directory: frontend
        run: |
          nohup npx next start -p 3010 > ../frontend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3010 > /dev/null; then
              echo "Frontend arriba tras ${i} intentos"
              exit 0
            fi
            sleep 2
          done
          echo "::error::next start no respondio en 60s"
          tail -n 100 ../frontend-e2e.log
          exit 1

      # Solo cachea (no restaura obligatoriamente): si el cache falla, el paso
      # siguiente de install descarga de nuevo y el job no se rompe.
      - name: Cache Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3010
        run: npm run test:e2e

      # Traces + HTML report para depurar el fallo desde el artifact.
      - name: Subir informes Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-e2e.log
            frontend-e2e.log
          if-no-files-found: ignore

  # Los dos Dockerfiles del backend deben mantener el mismo cuerpo de build
  # (cabeceras-comentario aparte). Ver .github/DEPLOY.md.
  docker-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Comparar cuerpos de build
        run: |
          strip() { grep -v '^[[:space:]]*#' "$1" | sed 's/\r$//'; }
          diff <(strip backend/Dockerfile) <(strip backend/Dockerfile.vercel) \
            || { echo "::error::backend/Dockerfile y Dockerfile.vercel divergen - sincronizar ambos (ver .github/DEPLOY.md)"; exit 1; }
